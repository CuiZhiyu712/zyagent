server:
  port: 8080

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: zyagent
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zyagent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    mcp:
      server:
        enabled: ${ZYAGENT_MCP_ENABLED:true}
        name: zyagent-mcp-server
        version: 0.1.0
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:zyagent-not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-pro}
          temperature: 0.3

zyagent:
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection: ${MILVUS_COLLECTION:zyagent_documents}
  embedding:
    provider: ${EMBEDDING_PROVIDER:hash}
    api-key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:}
    model: ${EMBEDDING_MODEL:text-embedding-v3}
    dimension: ${EMBEDDING_DIMENSION:128}
  job-collect:
    enabled: ${JOB_COLLECT_ENABLED:true}
    cron: ${JOB_COLLECT_CRON:0 0 8 * * ?}
    timeout-seconds: ${JOB_COLLECT_TIMEOUT_SECONDS:8}
    max-pages-per-source: ${JOB_COLLECT_MAX_PAGES_PER_SOURCE:3}
    keywords: ${JOB_COLLECT_KEYWORDS:Java,后端,Spring Boot,Redis,MySQL,校招,实习,agent,大模型}
  boss-collect:
    enabled: ${BOSS_COLLECT_ENABLED:true}
    city: ${BOSS_COLLECT_CITY:北京}
    keywords: ${BOSS_COLLECT_KEYWORDS:Java 后端 实习,AI Agent 后端 实习}
    max-pages: ${BOSS_COLLECT_MAX_PAGES:3}
    max-jobs: ${BOSS_COLLECT_MAX_JOBS:60}
    profile-dir: ${BOSS_BROWSER_PROFILE_DIR:./data/browser/boss-profile}
    headless: ${BOSS_BROWSER_HEADLESS:false}
  upload:
    directory: ${ZYAGENT_UPLOAD_DIR:./data/uploads}
  chat:
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:6}
  agent:
    replan-max-attempts: ${AGENT_REPLAN_MAX_ATTEMPTS:1}
  task:
    owner-id: ${ZYAGENT_TASK_OWNER_ID:local-user}
    max-plan-steps: ${ZYAGENT_TASK_MAX_PLAN_STEPS:12}
    max-tool-calls: ${ZYAGENT_TASK_MAX_TOOL_CALLS:8}
    timeout-ms: ${ZYAGENT_TASK_TIMEOUT_MS:120000}
    tool-timeout-ms: ${ZYAGENT_TASK_TOOL_TIMEOUT_MS:15000}
    max-retries: ${ZYAGENT_TASK_MAX_RETRIES:1}
    strict-persistence: ${ZYAGENT_TASK_STRICT_PERSISTENCE:false}
  retrieval:
    vector-top-k: ${ZYAGENT_RETRIEVAL_VECTOR_TOP_K:20}
    keyword-top-k: ${ZYAGENT_RETRIEVAL_KEYWORD_TOP_K:20}
    fuse-limit: ${ZYAGENT_RETRIEVAL_FUSE_LIMIT:30}
    rank-constant: ${ZYAGENT_RETRIEVAL_RANK_CONSTANT:60}
    rerank-limit: ${ZYAGENT_RETRIEVAL_RERANK_LIMIT:8}
    rerank:
      enabled: ${ZYAGENT_RERANK_ENABLED:false}
      endpoint: ${ZYAGENT_RERANK_ENDPOINT:}
      timeout-ms: ${ZYAGENT_RERANK_TIMEOUT_MS:1500}
      max-candidates: ${ZYAGENT_RERANK_MAX_CANDIDATES:30}
      max-content-chars: ${ZYAGENT_RERANK_MAX_CONTENT_CHARS:600}
  interview:
    max-turns: ${ZYAGENT_INTERVIEW_MAX_TURNS:8}
    max-follow-ups: ${ZYAGENT_INTERVIEW_MAX_FOLLOW_UPS:1}
    model-timeout-ms: ${ZYAGENT_INTERVIEW_MODEL_TIMEOUT_MS:8000}
  mcp:
    enabled: ${ZYAGENT_MCP_ENABLED:true}
  structured-output:
    enabled: ${STRUCTURED_OUTPUT_ENABLED:true}
